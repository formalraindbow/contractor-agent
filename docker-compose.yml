# Два сервиса из одного образа: agent-api (граф + SSE) и mcp-server (streamable-http для демо и внешних клиентов).
# Ключи — из .env. Postgres-чекпоинтер и профиль observability (Langfuse) — следующий шаг.
services:
  agent-api:
    build: .
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
    ports: ["8080:8080"]
    volumes: ["./runs:/app/runs"]
  mcp-server:
    build: .
    env_file: .env
    command: ["kontragent-mcp", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8765"]
    ports: ["8765:8765"]
