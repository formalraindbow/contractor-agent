[project]
name = "contractor-agent"
version = "0.1.0"
description = "Агент и MCP-сервер для проверки контрагента — кейс 14 Альфа-Банка, AI Product Hack 2026"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "mcp[cli]>=2.1.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0.3",
]

[project.scripts]
kontragent = "contractor_agent.cli:main"
kontragent-mcp = "contractor_agent.mcp_server.server:main"
kontragent-api = "contractor_agent.api.server:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contractor_agent", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F — ошибки и pyflakes, I — сортировка импортов, UP — современный синтаксис 3.12,
# B — bugbear (ловушки вроде изменяемых дефолтов), SIM — упрощения.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --import-mode=importlib -m \"not live\""
markers = ["live: нужны сеть и ключ модели; запуск: pytest -m live"]
