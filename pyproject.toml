[project]
name = "contractor-agent"
version = "0.1.0"
description = "Агент и MCP-сервер для проверки контрагента — кейс 14 Альфа-Банка, AI Product Hack 2026"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contractor_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F — ошибки и pyflakes, I — сортировка импортов, UP — современный синтаксис 3.12,
# B — bugbear (ловушки вроде изменяемых дефолтов), SIM — упрощения.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --import-mode=importlib"
