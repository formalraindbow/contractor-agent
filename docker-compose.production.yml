# docker compose --env-file .env.production -f docker-compose.production.yml up -d --build
name: kontragent
services:
  agent-api:
    build: .
    image: kontragent:${APP_VERSION:-local}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    env_file: .env.production
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      SESSION_STORE: sqlite
      SESSION_DB_PATH: /app/state/sessions.sqlite
      INDEX_PATH: /app/state/snapshot.sqlite
      RUNS_DIR: /app/runs
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Only Caddy can reach the API; it supplies the original HTTPS scheme.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./state:/app/state
      - ./runs:/app/runs
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 100s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,urllib.request;
          req=urllib.request.Request('http://127.0.0.1:8080/v1/health',headers={'Cookie':'kontragent_key='+os.environ['WEB_PASSWORD']});
          urllib.request.urlopen(req,timeout=5).read()
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      agent-api:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  caddy_data:
  caddy_config:
