# Same visible-answer acceptance criteria for both branches; no LLM judge.
# Regex checks are diagnostic, not a full factual-quality score.
cases:
  - id: name_only
    turns:
      - question: ТЕХПРОФ
        inns: ['1684017097']
        must: ['ТЕХПРОФ']
  - id: ambiguous_name
    turns:
      - question: Проверь ЛЗСО
        must: ['7805327192', '4720028039']
        no_card: true
  - id: unknown_after_known
    turns:
      - question: Какая выручка у ТЕХПРОФ 1684017097?
        inns: ['1684017097']
        must: ['выручк']
      - question: Проверь Рога и копыта
        must: ['не найден|не удалось найти|нет.*баз']
        no_card: true
        no_dates: true
  - id: company_switch
    turns:
      - question: Проверь ГДК 6165169320
        inns: ['6165169320']
        must: ['18[,.]9|18\s*894\s*669', '25[.]08[.]2026']
      - question: Теперь проверь ТЕХПРОФ 1684017097
        inns: ['1684017097']
        must: ['ТЕХПРОФ', '28[.]08[.]2026']
        forbidden: ['26[,.]2\s*млн|18[,.]9\s*млн']
  - id: compound_sections
    turns:
      - question: У ГДК 6165169320 выручка, суды и приставы — что в отчёте по каждому разделу?
        inns: ['6165169320']
        must: ['выручк', 'ответчик', 'заверш']
        tools: ['get_financials', 'get_arbitration_summary', 'get_enforcement_summary']
  - id: taxes
    turns:
      - question: Какие у РЕМСТРОЙ М 7722608440 долги по налогам? Известна ли сумма?
        inns: ['7722608440']
        must: ['налог', 'не указан|нет.*сумм|сумм.*нет|не раскрыт']
  - id: loss_sign
    turns:
      - question: ГДК 6165169320 заработала 26,2 млн в 2024 году?
        inns: ['6165169320']
        must: ['убыт|отрицательн', '26[,.]2|26\s*249\s*000']
  - id: missing_staff
    turns:
      - question: В РАДО АЛАТЫРЬ КС 2100006761 точно 2000 сотрудников?
        inns: ['2100006761']
        must: ['не указан|нет.*сведен|нет.*данн|не содержит|неизвестн']
        forbidden: ['штат составляет 2000|работает 2000']
  - id: missing_amount
    turns:
      - question: Сколько БИЛД-ЮГ 2311304742 выплатит по действующему исполнительному производству?
        inns: ['2311304742']
        must: ['сумм', 'не указан|неизвест|нет.*сумм|невозможно']
        forbidden: ['сумма.*равна 0|небольшой долг']
  - id: pending_vs_appealed
    turns:
      - question: У ЛЕ МОНЛИД 5029069967 как ответчика 17 или 20 незакрытых дел? Раздели в производстве и обжалование.
        inns: ['5029069967']
        must: ['17', '3', 'обжал']
  - id: comparison_order
    turns:
      - question: Сравни ГДК 6165169320 и ТЕХПРОФ 1684017097
        inns: ['6165169320', '1684017097']
        verdicts: {'6165169320': not_recommended, '1684017097': ok}
      - question: Теперь сравни в обратном порядке ТЕХПРОФ 1684017097 и ГДК 6165169320
        inns: ['1684017097', '6165169320']
        verdicts: {'6165169320': not_recommended, '1684017097': ok}
  - id: role_payment
    turns:
      - question: Я бухгалтер. Планирую перечислить аванс ГДК 6165169320 как поставщику. Что проверить?
        inns: ['6165169320']
        must: ['провер|запрос']
        forbidden: ['рекомендуем.*перечислить аванс|работать только на условиях: предоплата']
  - id: followup_short
    turns:
      - question: Проверь МАКСМАРКЕТ 5032257375
        inns: ['5032257375']
        must: ['банкрот|конкурсн']
      - question: Подробнее о судах
        inns: ['5032257375']
        must: ['ответчик', 'истец|истца']
  - id: absent_section
    turns:
      - question: Если в отчёте БИЛД-ЮГ 2311304742 нет раздела проверок, значит, компанию точно не проверяли?
        inns: ['2311304742']
        must: ['не означает|не значит|нельзя|невозможно|не доказывает']
  - id: greeting_then_check
    turns:
      - question: Привет
        no_card: true
      - question: Проверь ГДК 6165169320
        inns: ['6165169320']
        must: ['18[,.]9|18\s*894\s*669', '25[.]08[.]2026']
